<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CodeQuest — Learn coding through interactive games, challenges, and real projects. Python, HTML, CSS, JavaScript, React, Git, and DSA." />
    <meta property="og:title" content="CodeQuest — Level Up Your Code" />
    <meta property="og:description" content="Learn Python, HTML, CSS, JavaScript, React, Git and DSA through fun interactive lessons. Earn XP, unlock badges, build real projects." />
    <meta property="og:url" content="https://codequest-rouge.vercel.app/" />
    <title>CodeQuest — Level Up Your Code</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: #07070f;
        color: #e8e8f0;
        font-family: 'DM Sans', sans-serif;
        min-height: 100vh;
      }
      /* Loading screen shown before React mounts */
      #splash {
        position: fixed; inset: 0;
        background: #07070f;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 20px; z-index: 9999;
        transition: opacity 0.4s ease;
      }
      #splash .logo {
        font-family: 'Syne', sans-serif;
        font-size: 2rem; font-weight: 800; color: #e8e8f0;
      }
      #splash .logo span { color: #00ff9f; font-family: 'Space Mono', monospace; }
      #splash .bar { width: 200px; height: 4px; background: rgba(255,255,255,0.08); border-radius: 2px; overflow: hidden; }
      #splash .fill { height: 100%; width: 0; background: #00ff9f; border-radius: 2px; animation: load 1s ease forwards; }
      #splash .tip  { font-family: 'Space Mono', monospace; font-size: 0.72rem; color: #8888aa; animation: blink 1s infinite; }
      @keyframes load  { 0%{width:0} 60%{width:80%} 100%{width:100%} }
      @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
    </style>
  </head>
  <body>

    <!-- Splash shown instantly before React loads -->
    <div id="splash">
      <div class="logo"><span>&lt;/&gt;</span> CodeQuest</div>
      <div class="bar"><div class="fill"></div></div>
      <div class="tip">loading courses...</div>
    </div>

    <!-- React SPA mounts here and takes over everything -->
    <div id="root"></div>

    <script>
      // Hide splash once React has mounted
      window.__hideSplash = function() {
        const s = document.getElementById('splash');
        if (s) { s.style.opacity = '0'; setTimeout(() => s.remove(), 400); }
      };
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
